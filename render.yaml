# Render Blueprint for the standalone EA-sync deployment of snallabot-service.
# See docs/standalone-sync-service.md for what this mode does and doesn't do.
#
# Deploy: push this file to the repo root, then in Render "New +" -> "Blueprint",
# point it at this repo/branch. Render reads this file and creates the service.
# Fill in the `sync: false` env vars in the dashboard after the first deploy -
# they're marked that way so their values never get committed to git.

services:
  # Single service: EA OAuth dashboard + the sync-trigger/config API your app
  # calls (export, updateExport, deleteExport, exportStatus, unlink), AND the
  # continuous EA-token-refresh loop (src/dashboard/ea_refresher.ts) running
  # in the same Node process (started from src/index.ts) rather than as a
  # separate worker service - see docs/standalone-sync-service.md.
  #
  # This must stay on a paid plan, not free: Render's free web services spin
  # down after ~15 min without HTTP traffic, which would pause the token
  # refresh loop along with the dashboard and let connected leagues' EA
  # tokens go stale whenever nobody's visited the dashboard recently. A
  # paid plan (e.g. Starter) never spins down, so the refresh loop keeps
  # running regardless of dashboard traffic - the same guarantee a separate
  # background worker gave before this was merged into one service.
  - type: web
    name: eaclient-sync-service
    runtime: node
    plan: starter
    branch: standalone-ea-sync-service
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /debug/memoryUsage
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '21'
      - key: DEPLOYMENT_URL
        # Render sets RENDER_EXTERNAL_URL automatically; if you attach a
        # custom domain instead, replace this with that domain's https URL.
        fromService:
          type: web
          name: eaclient-sync-service
          property: host
      - key: SYNC_API_KEY
        sync: false # generate a long random secret, paste it in the Render dashboard
      - key: SERVICE_ACCOUNT
        sync: false # paste the full Firestore service-account JSON (one line) here
      - key: PUSHGATEWAY_URL
        sync: false # optional - only if you run a Prometheus Pushgateway
      # Fail-closed allowlist (src/config.ts) for the /connect return_to
      # redirect - without this, selecting a league silently strands the
      # browser on this service's own /dashboard/league/{leagueId} instead of
      # returning to the consuming app. Exact origin match required (scheme +
      # host, no trailing slash, no path) - comma-separate multiple origins.
      - key: ALLOWED_RETURN_TO_ORIGINS
        value: https://leaguecard-web-2ea6.onrender.com
