# Render Blueprint for the standalone EA-sync deployment of snallabot-service.
# See docs/standalone-sync-service.md for what this mode does and doesn't do.
#
# Deploy: push this file to the repo root, then in Render "New +" -> "Blueprint",
# point it at this repo/branch. Render reads this file and creates both services.
# Fill in the `sync: false` env vars in the dashboard after the first deploy -
# they're marked that way so their values never get committed to git.

services:
  # Public web service: EA OAuth dashboard + the sync-trigger/config API
  # your app calls (export, updateExport, deleteExport, exportStatus, unlink).
  - type: web
    name: eaclient-sync-service
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /debug/memoryUsage
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "21"
      - key: DEPLOYMENT_URL
        # Render sets RENDER_EXTERNAL_URL automatically; if you attach a
        # custom domain instead, replace this with that domain's https URL.
        fromService:
          type: web
          name: eaclient-sync-service
          property: host
      - key: SYNC_API_KEY
        sync: false # generate a long random secret, paste it in the Render dashboard
      - key: SERVICE_ACCOUNT
        sync: false # paste the full Firestore service-account JSON (one line) here
      - key: PUSHGATEWAY_URL
        sync: false # optional - only if you run a Prometheus Pushgateway

  # Background worker: keeps connected leagues' EA tokens refreshed so the
  # web service never needs a fresh browser login. Must stay running
  # continuously (it's an infinite loop, not a one-shot job) - see
  # src/dashboard/ea_refresher.ts.
  - type: worker
    name: eaclient-ea-refresher
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run ea-refresher
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "21"
      - key: SERVICE_ACCOUNT
        sync: false # same Firestore service-account JSON as the web service
      - key: PUSHGATEWAY_URL
        sync: false # optional
